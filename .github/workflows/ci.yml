name: Cloud Native CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run tests
      - name: Run tests
        run: pytest

      # 5. Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 6. Build Docker image
      - name: Build Docker Image
        run: docker build -t cloud-native-cicd:local .

      # 7. Tag Docker Image
      - name: Tag Docker Image
        run: docker tag cloud-native-cicd:local w616/cloud-native-cicd:latest

      # 8. Push Docker Image
      - name: Push Docker Image
        run: docker push w616/cloud-native-cicd:latest

  deploy-test:
     runs-on: ubuntu-latest

     steps:
       - name: Validate SSH key
         run: |
           mkdir -p ~/.ssh

           echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/ec2_key

           chmod 600 ~/.ssh/ec2_key

           echo "First line:"
           head -n 1 ~/.ssh/ec2_key

           echo "Last line:"
           tail -n 1 ~/.ssh/ec2_key

           echo "Testing key:"
           ssh-keygen -y -f ~/.ssh/ec2_key > /tmp/github-key.pub