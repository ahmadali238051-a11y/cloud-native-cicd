name: Cloud Native CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run tests
      - name: Run tests
        run: pytest

      # 5. Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 6. Build Docker image
      - name: Build Docker Image
        run: docker build -t cloud-native-cicd:local .

      # 7. Tag image for Docker Hub
      - name: Tag Docker Image
        run: docker tag cloud-native-cicd:local ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-cicd:${{ github.sha }}
      
      # 8. Tag image for latest
      - name: Tag Docker Image as latest
        run: docker tag cloud-native-cicd:local ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-cicd:latest 

      # 9. Push image to Docker Hub
      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-cicd:${{ github.sha }}
      
      # 10. Push latest image to Docker Hub
      - name: Push latest image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-native-cicd:latest