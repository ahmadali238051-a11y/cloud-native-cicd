name: Cloud Native CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:

        - name: Checkout code
          uses: actions/checkout@v5

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.12"
        - name: Install dependencies
          run: pip install -r requirements.txt
        - name: Run Tests
          run: pytest
        - name: Docker Login
          uses: actions/docker-login@v4
          with: 
             dockerhub_username: ${{secrets.DOCKERHUB_USERNAME}}
             dockerhub_password: ${{secrets.DOCKERHUB_PASSWORD}}
        - name: Build Docker Image
          run: docker build -t cloud-native-cicd:local .  
        - name: Tag docker image
          run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/cloud-native-cicd:local . 
        - name: Push to Docker Hub
          run: docker push ${{secrets.DOCKERHUB_USERNAME}}/cloud-native-cicd:local