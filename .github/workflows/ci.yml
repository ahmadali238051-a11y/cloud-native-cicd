name: Cloud Native CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run tests
      - name: Run tests
        run: pytest

      # 5. Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 6. Build Docker image
      - name: Build Docker Image
        run: docker build -t w616/cloud-native-cicd:${{ github.sha }} .

      # 7. Push Docker Image
      - name: Push Docker Image
        run: docker push w616/cloud-native-cicd:${{ github.sha }}

  deploy-test:
     runs-on: ubuntu-latest

     steps:
       - name: Test SSH connection
         uses: appleboy/ssh-action@v1.2.5
         with:
           host: ${{ secrets.EC2_HOST }}
           username: ${{ secrets.EC2_USERNAME }}
           key: ${{ secrets.EC2_SSH_KEY }}
           script: |
             echo "SSH connection successful"

       - name: Deploy to EC2
         uses: appleboy/ssh-action@v1.2.5
         with:
           host: ${{ secrets.EC2_HOST }}
           username: ${{ secrets.EC2_USERNAME }}
           key: ${{ secrets.EC2_SSH_KEY }}
           script: |
             sudo docker pull w616/cloud-native-cicd:${{ github.sha }}
             sudo docker stop cloud-native-api
             sudo docker rm cloud-native-api
             sudo docker run -d -p 8000:8000 --name cloud-native-api w616/cloud-native-cicd:${{ github.sha }}